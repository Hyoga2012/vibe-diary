<!-- 음성 입력 버튼 -->
<button
    class="icon-btn voice-btn"
    title="음성 입력"
    aria-label="음성 입력"
    type="button"
>
    <svg
        class="voice-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
    >
        <path d="M4 10v4"></path>
        <path d="M8 7v10"></path>
        <path d="M12 4v16"></path>
        <path d="M16 7v10"></path>
        <path d="M20 10v4"></path>
    </svg>
</button>


<!-- 전송 버튼 -->
<button
    class="send-btn"
    type="button"
    aria-label="전송"
    title="전송"
>
    <svg
        class="send-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
    >
        <path d="M12 19V5"></path>
        <path d="M6.5 10.5 12 5l5.5 5.5"></path>
    </svg>
</button>
